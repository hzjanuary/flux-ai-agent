[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fluxclaw"
version = "0.1.0"
description = "Owner-only personal Telegram agent with an offline-testable core"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
telegram = ["Telethon==1.42.0"]

[project.scripts]
flux = "flux.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.1",
    "ruff==0.14.2",
    "mypy==1.18.2",
    "pip-audit==2.10.1",
    "pip-licenses==5.0.0",
    "cyclonedx-bom==7.2.1",
    "lxml==6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["flux"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["flux"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
